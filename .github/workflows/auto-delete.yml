name: auto-delete-after-retention
# Retention: delete site + statistics on/after 2027-01-20 (3 months after launch).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Check date
        id: d
        run: |
          if [ "$(date -u +%Y%m%d)" -ge 20270120 ]; then echo "go=1" >> $GITHUB_OUTPUT; else echo "Not yet."; fi
      - name: Erase counters
        if: steps.d.outputs.go == '1'
        env:
          P: ${{ secrets.ABACUS_PLAY_KEY }}
          V: ${{ secrets.ABACUS_VIEWS_KEY }}
        run: |
          for kv in "play:$P" "views:$V"; do k=${kv%%:*}; t=${kv#*:}
            curl -s -X POST -H "Authorization: Bearer $t" https://abacus.jasoncameron.dev/reset/grokbot-wop-tracker/$k || true
            curl -s -X POST -H "Authorization: Bearer $t" https://abacus.jasoncameron.dev/delete/grokbot-wop-tracker/$k || true
          done
      - name: Unpublish Pages
        if: steps.d.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE repos/${{ github.repository }}/pages || echo "Pages delete via token not permitted; content wipe below still takes the site down."
      - name: Wipe repository content (orphan commit, no history)
        if: steps.d.outputs.go == '1'
        uses: actions/checkout@v4
      - if: steps.d.outputs.go == '1'
        run: |
          git checkout --orphan wiped
          git rm -rf . -q
          echo "This campaign page was deleted on schedule (retention 3 months, until 20.01.2027)." > README.md
          git add README.md
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -m "Retention: delete site and data"
          git push -f origin wiped:main
